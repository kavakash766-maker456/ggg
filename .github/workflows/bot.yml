name: FilmFeed WhatsApp Bot 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

concurrency:
  group: whatsapp-bot-instance
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssl ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            cryptography \
            pycryptodome \
            requests \
            beautifulsoup4 \
            gdown \
            telethon \
            Pillow \
            playwright \
            playwright-stealth \
            aiohttp \
            aiofiles \
            rich \
            curl_cffi
          python -m playwright install chromium --with-deps

      - name: Install Node Dependencies
        run: npm install

      - name: Run FilmFeed Bot Engine
        env:
          BOT_PHONE: "94760372547"
          TARGET_GROUP_JID: "120363419930344447@g.us"
          TARGET_GROUP_JIDS: "120363419930344447@g.us,120363428509877949@g.us"
          SESSION_VAULT_ID: "8f37b6dbcf07ff6fab07b21cc8cbe05b"
          AUTH_DIR: "auth_info"
          LOG_LEVEL: "info"
          RUNNER_LIFETIME_HOURS: "4.5"
          TMDB_API_KEY: "4314318a94f644b5d1661d5376c25f64"
          TG_API_ID: "7012205"
          TG_API_HASH: "840af80809b74458f7feaa110e5a6cc6"
          TG_SESSION_STRING: "1BVtsOMQBuxImNO6Wyf4Ot181LDjrEfPye8DktJ2-oj1RDmcAbUwizMdo2PDu7sOmX4Ttw9WcPkJ6fMZA1LwEJDC9bnlA1vPsjM4HhvcZjF59iikcNPnNAv7GXaQjlingg5ViyxWUhyTp26AvvpBWlvL4VEzIUNqu4YLnRx-R3fefkVm8wEbkmVxGDKBnv3yK1Tx7Raohr_GzhqiKwF2K7VC7d57v9DX5dfFyb3k7PnsGiiYgcBp9owy3wj4s3f_HCql4yLWUin_FXaNUaaQYaWa1oXVeKkSHuDuu-wtlXzE6sVV3gEf6FnDu6A-FpI5wJRYl5UuiMgZV-vNpTGLvGgJpJfokL4I="
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p auth_info temp
          START_TIME=$(date +%s)
          while true; do
            echo "🚀 Starting FilmFeed Bot Engine..."
            node src/index.js
            EXIT_CODE=$?
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if [ $EXIT_CODE -eq 0 ] && [ $ELAPSED -ge 16200 ]; then
              echo "✅ Scheduled 4.5h rotation completed cleanly. Handing off..."
              break
            fi

            if [ $ELAPSED -ge 17280 ]; then
              echo "⏳ Runner lifespan reached 4.8h. Handing off..."
              break
            fi

            echo "⚠️ Process exited with code $EXIT_CODE after ${ELAPSED}s. Restarting in 5s..."
            sleep 5
          done

      - name: Auto-Trigger Next 24/7 Session Runner
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run "FilmFeed WhatsApp Bot 24/7" --repo ${{ github.repository }} || \
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}' || true
